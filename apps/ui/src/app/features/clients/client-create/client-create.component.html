<app-page-header title="New Client" [breadcrumbs]="['Home', 'Clients', 'New Client']" subtitle="Create client profile.">
  <div header-actions>
    <button mat-stroked-button type="button" (click)="cancel()" [disabled]="isSaving">Cancel</button>
    <button mat-flat-button color="primary" type="button" (click)="saveClient()" [disabled]="isSaving">Create Client</button>
  </div>
</app-page-header>

<mat-card class="page-card" appearance="raised">
  <section class="section">
    <h3>Profile</h3>
    <form [formGroup]="clientForm" class="grid">
      <mat-form-field appearance="outline">
        <mat-label>Full Name</mat-label>
        <input matInput formControlName="fullName" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput appPhoneInput type="tel" inputmode="tel" autocomplete="tel" formControlName="phone" />
        @if (clientForm.controls.phone.hasError('required')) {
          <mat-error>Phone is required.</mat-error>
        } @else if (clientForm.controls.phone.hasError('phone')) {
          <mat-error>Enter a valid phone number.</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="outline" class="span-all">
        <mat-label>Notes</mat-label>
        <textarea matInput rows="3" formControlName="notes"></textarea>
      </mat-form-field>
    </form>
  </section>
</mat-card>
