<app-page-header title="Clients" [breadcrumbs]="['Home', 'Clients']" subtitle="Client directory and order context.">
  <div header-actions>
    <button mat-flat-button color="primary">New Client</button>
  </div>
</app-page-header>

<mat-card class="page-card" appearance="raised">
  <div class="toolbar-row">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search by name, phone, or email</mat-label>
      <input matInput [value]="searchQuery" (input)="applySearch($any($event.target).value)" />
    </mat-form-field>

    <button mat-stroked-button (click)="clearSearch()">Clear</button>
    <button mat-stroked-button (click)="refresh()">Refresh</button>
  </div>

  @if (isLoading) {
    <section class="loading-state">
      <mat-spinner diameter="36"></mat-spinner>
      <p>Loading clients...</p>
    </section>
  } @else if (hasNoResults()) {
    <app-empty-state
      title="No matching clients"
      description="Try a different search term."
      actionLabel="Reset"
      (action)="clearSearch()"
    ></app-empty-state>
  } @else {
    <div class="table-wrap">
      <table mat-table [dataSource]="dataSource" matSort matSortDisableClear class="clients-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
          <td mat-cell *matCellDef="let row"><a [routerLink]="'/clients/' + row.id">{{ row.name }}</a></td>
        </ng-container>

        <ng-container matColumnDef="phone">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Phone</th>
          <td mat-cell *matCellDef="let row">{{ row.phone }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
          <td mat-cell *matCellDef="let row">{{ row.email }}</td>
        </ng-container>

        <ng-container matColumnDef="activeOrders">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Active Orders</th>
          <td mat-cell *matCellDef="let row">{{ row.activeOrders }}</td>
        </ng-container>

        <ng-container matColumnDef="lastVisit">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Last Visit</th>
          <td mat-cell *matCellDef="let row">{{ row.lastVisit }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let row">
            <button mat-stroked-button (click)="quickCall(row)">Call</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
    </div>
  }
</mat-card>
